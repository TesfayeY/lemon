openapi: 3.1.0
info:
  title: Lemon API
  version: 0.4.0
  description: |
    Contract for phases 03-04: identity bootstrap, onboarding, catalogs,
    profiles, prompt answers and preferences.

    Response DTOs set `additionalProperties: false` so that any field added to
    a response (for example a private field leaking into a public profile)
    fails the contract test in `apps/api/test/contract.test.ts`.

    Successful responses are wrapped as `{ data, meta }`; failures as
    `{ error, requestId }`.
servers:
  - url: http://localhost:3000
security:
  - firebaseIdToken: []

paths:
  /v1/me/bootstrap:
    post:
      summary: Idempotently map the verified Firebase identity to an app account
      description: Also syncs the cached email verification flag from the verified token.
      responses:
        '200':
          description: Existing account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapResponse' }
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/me:
    get:
      summary: Private own-account snapshot with readiness and missing onboarding steps
      responses:
        '200':
          description: Account snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Account' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/me/onboarding:
    patch:
      summary: Save birth date and/or terms acceptance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                birthDate:
                  type: string
                  format: date
                  description: ISO calendar date; must be 18+ and not in the future
                termsAccepted:
                  const: true
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdatedResponse' }
        '400': { $ref: '#/components/responses/NoUpdates' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/catalogs:
    get:
      summary: Static catalogs with stable IDs
      security: []
      responses:
        '200':
          description: Catalogs
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Catalogs' }
                  meta: { $ref: '#/components/schemas/Meta' }

  /v1/me/profile:
    get:
      summary: Owner view of the profile draft, visibility settings and answers awaiting review
      responses:
        '200':
          description: Own profile
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/SelfProfile' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Edit own profile draft fields
      description: |
        Requires the revision the edit was based on. Server-owned fields
        (readiness, status, roles, revisions) are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionedUpdateResponse' }
        '400': { $ref: '#/components/responses/NoUpdates' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/me/profile/preview:
    get:
      summary: Own profile exactly as other people would see it
      responses:
        '200':
          description: Public projection of own profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/prompts:
    post:
      summary: Submit an answer to a prompt; it is held for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [promptId, text]
              properties:
                promptId: { type: string }
                text: { $ref: '#/components/schemas/PromptText' }
      responses:
        '201':
          description: Answer submitted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [id, promptId, state, revision]
                    properties:
                      id: { type: string }
                      promptId: { type: string }
                      state: { $ref: '#/components/schemas/ReviewState' }
                      revision: { type: integer, minimum: 1 }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/me/prompts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      summary: Submit replacement text for review; approved text stays published meanwhile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, text]
              properties:
                expectedRevision: { type: integer }
                text: { $ref: '#/components/schemas/PromptText' }
      responses:
        '200':
          description: Replacement submitted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [id, state, revision]
                    properties:
                      id: { type: string }
                      state: { $ref: '#/components/schemas/ReviewState' }
                      revision: { type: integer, minimum: 1 }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Remove an own answer
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [deleted]
                    properties:
                      deleted: { const: true }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/preferences:
    get:
      summary: Private dating preferences
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Preferences' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Edit dating preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferencesUpdate' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionedUpdateResponse' }
        '400': { $ref: '#/components/responses/NoUpdates' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Opaque app user ID (never a Firebase UID)
        schema: { type: string }
    get:
      summary: Public profile; viewer must be active and ready
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/discovery:
    get:
      summary: Discover page (new session, or continue one with a cursor)
      description: |
        Without `cursor`, starts a short-lived discovery session: a bounded,
        server-shuffled snapshot of mutually eligible candidates tied to the
        viewer's preferences revision and residence city. With `cursor`,
        continues that session. Eligibility (status, readiness, pause, mutual
        gender/interest, mutual age, mutual US city/state/nationwide scope,
        likes, passes, blocks and other pair exclusions) is rechecked for every
        page, and the cursor tracks scanned positions, so pages never repeat or
        skip a candidate. Order is a uniform shuffle; nothing is ranked.

        `status`:
        - `more`: call again with `meta.nextCursor`. A page can be short, even
          empty, when many scanned candidates dropped out.
        - `end`: the session is fully scanned; start a new one later.
        - `empty`: nobody matches the viewer's current filters. Filters are
          never widened by the server; offer a user-triggered filter change.

        Errors: `INVALID_CURSOR` (400, malformed, tampered or another person's
        cursor), `DISCOVERY_SESSION_EXPIRED` and `DISCOVERY_SESSION_INVALIDATED`
        (409, retryable: restart without a cursor), `ACCOUNT_NOT_ELIGIBLE` and
        `DISCOVERY_PAUSED` (403).
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque signed cursor from `meta.nextCursor`
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: One page of candidates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryPageResponse' }
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DiscoverySessionStale' }

  /v1/passes:
    post:
      summary: Pass on a candidate for the cooldown (default 30 days)
      description: |
        Idempotent per viewer and candidate: repeating an active pass returns it
        unchanged; a pass whose cooldown has ended is renewed. Any existing user
        may be passed, so the response never reveals whether the candidate is
        blocked, paused or otherwise unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidateId]
              properties:
                candidateId: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Pass recorded (or already active)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PassResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # --- Staff API (Phase 13). Every route: verified Firebase ID token with the
  # `staffRole` custom claim (moderator | admin). 401 for missing/invalid/revoked
  # tokens; 403 STAFF_ONLY (no staff claim), STAFF_EMAIL_UNVERIFIED,
  # INSUFFICIENT_ROLE (moderator on an admin route), RECENT_AUTH_REQUIRED
  # (account actions need a sign-in within ADMIN_RECENT_AUTH_MAX_AGE_SECONDS),
  # SELF_ACTION_FORBIDDEN (staff acting on their own account or content).

  /v1/admin/me:
    get:
      summary: The caller's verified staff role and permissions
      responses:
        '200':
          description: Staff identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMeResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/reasons:
    get:
      summary: Fixed reason catalogs for staff decisions (moderator)
      responses:
        '200':
          description: Reason catalogs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReasonsResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/content/photos:
    get:
      summary: Pending photo queue, oldest upload first (moderator)
      description: Keyset pagination on (submittedAt, id); deciding listed items does not shift later pages.
      parameters:
        - $ref: '#/components/parameters/AdminCursor'
        - $ref: '#/components/parameters/AdminLimit'
      responses:
        '200':
          description: One page of pending photos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPhotoQueueResponse' }
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/admin/content/photos/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: One photo with the minimum context a reviewer needs (moderator)
      responses:
        '200':
          description: Photo review detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPhotoDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/content/photos/{id}/media/{variant}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: variant, in: path, required: true, schema: { type: string, enum: [thumb, display] } }
    get:
      summary: Stream a variant of a reviewable photo, pending included (moderator)
      description: |
        Metadata-free variants only; the private master is never served.
        `Cache-Control: private, no-store`. Deleted, failed and processing
        photos return 404 MEDIA_UNAVAILABLE.
      responses:
        '200':
          description: Image bytes
          content:
            image/webp:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Storage temporarily unavailable (retryable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/admin/content/photos/{id}/review:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Approve or reject a pending photo (moderator)
      description: |
        Compare-and-set on the pending state, in one transaction with the
        audit entry. A second decision gets 409 REVIEW_CONFLICT and writes
        nothing. `reason` is required for rejections (photoRejection catalog)
        and not allowed for approvals; `note` is internal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReviewRequest' }
      responses:
        '200':
          description: Decision committed and audited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPhotoDecisionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/admin/content/prompt-answers:
    get:
      summary: Pending prompt answer queue, oldest submission first (moderator)
      description: An owner edit is a new submission and moves the answer to the back.
      parameters:
        - $ref: '#/components/parameters/AdminCursor'
        - $ref: '#/components/parameters/AdminLimit'
      responses:
        '200':
          description: One page of pending answers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPromptQueueResponse' }
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/admin/content/prompt-answers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: One prompt answer with its published and pending text (moderator)
      responses:
        '200':
          description: Prompt answer review detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPromptDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/content/prompt-answers/{id}/review:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Approve or reject a pending prompt answer (moderator)
      description: |
        `expectedRevision` is the answer revision the reviewer saw. Approve
        publishes the pending text and increments publishedRevision. Reject
        keeps any published text live and shows the owner the reason. A stale
        revision or an already-decided answer gets 409 REVIEW_CONFLICT with
        `currentRevision`, and nothing is written.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPromptReviewRequest' }
      responses:
        '200':
          description: Decision committed and audited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPromptDecisionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/admin/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Account summary for staff (admin)
      responses:
        '200':
          description: Account summary; never DOB, email or Firebase UID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccountResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/users/{id}/suspend:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Suspend an onboarding or active account (admin, recent sign-in)
      description: |
        One transaction: compare-and-set on account status and guardVersion,
        guardVersion increment, audit entry. New actions stop immediately;
        readiness is cleared. 409 ACCOUNT_STATE_CONFLICT for any other status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/AdminSuspensionReason' }
                note: { $ref: '#/components/schemas/AdminNote' }
      responses:
        '200':
          description: Suspended and audited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccountActionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/admin/users/{id}/restore:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Restore a suspended account to its previous status (admin, recent sign-in)
      description: Same transaction rules as suspend. Never reopens closed matches or chats.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/AdminRestoreReason' }
                note: { $ref: '#/components/schemas/AdminNote' }
      responses:
        '200':
          description: Restored and audited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccountActionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/admin/audit-log:
    get:
      summary: Audit history of one target, oldest first (admin)
      description: Always scoped to a single target; there is no bulk export.
      parameters:
        - { name: targetType, in: query, required: true, schema: { type: string, enum: [photo, promptAnswer, user] } }
        - { name: targetId, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuditLogResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    firebaseIdToken:
      type: http
      scheme: bearer
      description: Firebase ID token; the only source of identity

  responses:
    Unauthenticated:
      description: Missing, invalid or revoked token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Account restricted or not eligible
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found or not owned by the caller
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NoUpdates:
      description: No editable fields in the request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Invalid state or duplicate
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RevisionConflict:
      description: The edit was based on a stale revision; refresh and reapply
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: One or more fields are invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidCursor:
      description: Malformed, tampered or not the caller's cursor (INVALID_CURSOR)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    DiscoverySessionStale:
      description: Session expired or preferences changed; restart without a cursor
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  parameters:
    AdminCursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor from `meta.nextCursor`
      schema: { type: string, maxLength: 256 }
    AdminLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  schemas:
    Meta:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId: { type: string }

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, requestId]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code:
              type: string
              examples: [VALIDATION_ERROR, REVISION_CONFLICT, NOT_FOUND, DUPLICATE_PROMPT]
            message: { type: string }
            retryable: { type: boolean }
            fieldErrors:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
            currentRevision:
              type: integer
              description: Present on REVISION_CONFLICT
        requestId: { type: string }

    UpdatedResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [updated]
          properties:
            updated: { type: array, items: { type: string } }
        meta: { $ref: '#/components/schemas/Meta' }

    RevisionedUpdateResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [updated, revision]
          properties:
            updated: { type: array, items: { type: string } }
            revision: { type: integer, minimum: 2 }
        meta: { $ref: '#/components/schemas/Meta' }

    BootstrapResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [userId, accountStatus, profileReady, adultEligible]
          properties:
            userId: { type: string }
            accountStatus: { $ref: '#/components/schemas/AccountStatus' }
            profileReady: { type: boolean }
            adultEligible: { type: boolean }
        meta: { $ref: '#/components/schemas/Meta' }

    AccountStatus:
      type: string
      enum: [onboarding, active, suspended, deletion_pending, deleted]

    ReadinessRequirement:
      type: string
      description: A requirement the profile does not yet meet, in onboarding order
      enum:
        - emailVerified
        - adultEligible
        - termsAccepted
        - displayName
        - genderIdentity
        - interests
        - location
        - intention
        - photos
        - promptAnswers
        - accountSuspended

    Readiness:
      type: object
      additionalProperties: false
      required: [ready, missing]
      properties:
        ready: { type: boolean }
        missing:
          type: array
          items: { $ref: '#/components/schemas/ReadinessRequirement' }

    Account:
      type: object
      description: Private; only ever returned to the account owner
      additionalProperties: false
      required: [userId, accountStatus, emailVerified, birthDate, adultEligible, profileReady,
        discoverPaused, agreements, readiness]
      properties:
        userId: { type: string }
        accountStatus: { $ref: '#/components/schemas/AccountStatus' }
        emailVerified: { type: boolean }
        birthDate: { type: [string, 'null'], format: date }
        adultEligible: { type: boolean }
        profileReady: { type: boolean }
        discoverPaused: { type: boolean }
        agreements:
          type: object
          additionalProperties: false
          required: [termsVersion, acceptedAt]
          properties:
            termsVersion: { type: [string, 'null'] }
            acceptedAt: { type: [string, 'null'], format: date-time }
        readiness: { $ref: '#/components/schemas/Readiness' }

    Visibility:
      type: string
      enum: [public, private]

    ReviewState:
      type: string
      enum: [pending, approved, rejected]

    DisplayName:
      type: string
      description: 1-40 grapheme clusters after whitespace normalization; any script
      minLength: 1

    PromptText:
      type: string
      description: 1-300 grapheme clusters after whitespace normalization
      minLength: 1

    OptionalText:
      type: [string, 'null']
      description: At most 100 grapheme clusters after whitespace normalization

    PromptAnswer:
      type: object
      description: A published answer as other users see it
      additionalProperties: false
      required: [id, promptId, promptText, text]
      properties:
        id: { type: string }
        promptId: { type: string }
        promptText: { type: string }
        text: { type: string }

    SelfPromptAnswer:
      type: object
      description: The owner's view of an answer, including a submission awaiting review
      additionalProperties: false
      required: [id, promptId, promptText, approvedText, pendingText, state, revision]
      properties:
        id: { type: string }
        promptId: { type: string }
        promptText: { type: string }
        approvedText: { type: [string, 'null'] }
        pendingText: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/ReviewState' }
        revision: { type: integer, minimum: 1 }
        rejectionReason:
          description: Owner-only; set only while state is rejected
          oneOf:
            - { $ref: '#/components/schemas/PromptRejection' }
            - { type: 'null' }

    SelfProfile:
      type: object
      additionalProperties: false
      required: [userId, displayName, genderIdentity, genderDisplay, cityId, cityName, stateCode,
        intention, bio, hometown, hometownDisplay, occupation, occupationDisplay, education,
        educationDisplay, height, heightDisplay, languages, languagesDisplay, religion,
        religionDisplay, promptAnswers, revision, profileReady]
      properties:
        userId: { type: string }
        displayName: { type: [string, 'null'] }
        genderIdentity: { type: [string, 'null'] }
        genderDisplay: { $ref: '#/components/schemas/Visibility' }
        cityId: { type: [string, 'null'] }
        cityName: { type: [string, 'null'] }
        stateCode: { type: [string, 'null'] }
        intention: { type: [string, 'null'] }
        bio: { type: [string, 'null'] }
        hometown: { $ref: '#/components/schemas/OptionalText' }
        hometownDisplay: { $ref: '#/components/schemas/Visibility' }
        occupation: { $ref: '#/components/schemas/OptionalText' }
        occupationDisplay: { $ref: '#/components/schemas/Visibility' }
        education: { $ref: '#/components/schemas/OptionalText' }
        educationDisplay: { $ref: '#/components/schemas/Visibility' }
        height: { type: [integer, 'null'], minimum: 100, maximum: 250 }
        heightDisplay: { $ref: '#/components/schemas/Visibility' }
        languages: { type: array, items: { type: string } }
        languagesDisplay: { $ref: '#/components/schemas/Visibility' }
        religion: { $ref: '#/components/schemas/OptionalText' }
        religionDisplay: { $ref: '#/components/schemas/Visibility' }
        promptAnswers:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/SelfPromptAnswer' }
        revision: { type: integer, minimum: 1 }
        profileReady: { type: boolean }

    PublicProfile:
      type: object
      description: |
        Explicit allowlist. Never contains birth date, email, Firebase UID,
        account status, moderation data, revisions or visibility settings.
        Fields the owner set to private are null (or empty for languages).
        Name, age and location are null only in the owner's preview of an
        incomplete draft.
      additionalProperties: false
      required: [userId, displayName, age, cityName, stateCode, intention, intentionLabel,
        genderIdentity, genderLabel, bio, hometown, occupation, education, height, languages,
        religion, promptAnswers]
      properties:
        userId: { type: string }
        displayName: { type: [string, 'null'] }
        age: { type: [integer, 'null'], minimum: 18 }
        cityName: { type: [string, 'null'] }
        stateCode: { type: [string, 'null'] }
        intention: { type: [string, 'null'] }
        intentionLabel: { type: [string, 'null'] }
        genderIdentity: { type: [string, 'null'] }
        genderLabel: { type: [string, 'null'] }
        bio: { type: [string, 'null'] }
        hometown: { type: [string, 'null'] }
        occupation: { type: [string, 'null'] }
        education: { type: [string, 'null'] }
        height: { type: [integer, 'null'] }
        languages: { type: array, items: { type: string } }
        religion: { type: [string, 'null'] }
        promptAnswers:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/PromptAnswer' }

    PublicProfileResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/PublicProfile' }
        meta: { $ref: '#/components/schemas/Meta' }

    ProfileUpdate:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer }
        displayName: { $ref: '#/components/schemas/DisplayName' }
        genderIdentity: { type: string, description: Gender catalog ID }
        genderDisplay: { $ref: '#/components/schemas/Visibility' }
        cityId: { type: string, description: City catalog ID; sets stateCode }
        intention: { type: string, description: Intention catalog ID }
        bio: { type: [string, 'null'], description: At most 500 grapheme clusters }
        hometown: { $ref: '#/components/schemas/OptionalText' }
        hometownDisplay: { $ref: '#/components/schemas/Visibility' }
        occupation: { $ref: '#/components/schemas/OptionalText' }
        occupationDisplay: { $ref: '#/components/schemas/Visibility' }
        education: { $ref: '#/components/schemas/OptionalText' }
        educationDisplay: { $ref: '#/components/schemas/Visibility' }
        height: { type: [integer, 'null'], minimum: 100, maximum: 250 }
        heightDisplay: { $ref: '#/components/schemas/Visibility' }
        languages:
          type: array
          description: Language catalog IDs; duplicates are removed
          items: { type: string }
        languagesDisplay: { $ref: '#/components/schemas/Visibility' }
        religion: { $ref: '#/components/schemas/OptionalText' }
        religionDisplay: { $ref: '#/components/schemas/Visibility' }

    LocationScope:
      type: string
      enum: [city, state, nationwide]

    Preferences:
      type: object
      description: Private; never part of any public projection
      additionalProperties: false
      required: [acceptedGenderCategories, minAge, maxAge, locationScope, longDistance, revision]
      properties:
        acceptedGenderCategories: { type: array, items: { type: string } }
        minAge: { type: integer, minimum: 18, maximum: 99 }
        maxAge: { type: integer, minimum: 18, maximum: 99 }
        locationScope: { $ref: '#/components/schemas/LocationScope' }
        longDistance: { type: boolean }
        revision: { type: integer, minimum: 1 }

    PreferencesUpdate:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer }
        acceptedGenderCategories:
          type: array
          minItems: 1
          description: Gender catalog IDs; duplicates are removed
          items: { type: string }
        minAge: { type: integer, minimum: 18, maximum: 99 }
        maxAge: { type: integer, minimum: 18, maximum: 99, description: Must be >= minAge }
        locationScope: { $ref: '#/components/schemas/LocationScope' }
        longDistance: { type: boolean }

    CatalogOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }

    Catalogs:
      type: object
      additionalProperties: false
      required: [states, cities, prompts, intentions, genderCategories, languages]
      properties:
        states:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, name]
            properties:
              code: { type: string }
              name: { type: string }
        cities:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, stateCode, countryCode]
            properties:
              id: { type: string }
              name: { type: string }
              stateCode: { type: string }
              countryCode: { const: US }
        prompts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, category, text, active]
            properties:
              id: { type: string }
              category: { type: string, enum: [general, cultural, lifestyle, dating] }
              text: { type: string }
              active: { const: true }
        intentions:
          type: array
          items: { $ref: '#/components/schemas/CatalogOption' }
        genderCategories:
          type: array
          items: { $ref: '#/components/schemas/CatalogOption' }
        languages:
          type: array
          items: { $ref: '#/components/schemas/CatalogOption' }

    DiscoveryPhoto:
      type: object
      description: Approved photo of a discoverable candidate; bytes only via the authenticated media route
      additionalProperties: false
      required: [id, order, width, height, contentVersion, media]
      properties:
        id: { type: string }
        order: { type: integer }
        width: { type: integer }
        height: { type: integer }
        contentVersion: { type: integer }
        media:
          type: object
          additionalProperties: false
          required: [thumb, display]
          properties:
            thumb: { type: string, pattern: '^/v1/media/[^/]+/thumb$' }
            display: { type: string, pattern: '^/v1/media/[^/]+/display$' }

    DiscoveryCard:
      type: object
      additionalProperties: false
      required: [profile, photos]
      properties:
        profile: { $ref: '#/components/schemas/PublicProfile' }
        photos:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/DiscoveryPhoto' }

    DiscoveryPageResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, status, preferencesRevision]
          properties:
            items:
              type: array
              maxItems: 10
              items: { $ref: '#/components/schemas/DiscoveryCard' }
            status: { type: string, enum: [more, end, empty] }
            preferencesRevision: { type: integer, minimum: 1 }
        meta:
          type: object
          additionalProperties: false
          required: [requestId, nextCursor]
          properties:
            requestId: { type: string }
            nextCursor: { type: [string, 'null'] }

    PassResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [candidateId, passedAt, expiresAt]
          properties:
            candidateId: { type: string }
            passedAt: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/Meta' }

    # --- Owner-only prompt rejection (SelfPromptAnswer.rejectionReason) ---

    PromptRejection:
      type: object
      description: Why the owner's latest submission was rejected. Owner-only; never in public DTOs.
      additionalProperties: false
      required: [code, messageKey, message, action]
      properties:
        code: { type: string, enum: [contact_details, sexual_content, hateful_or_harassing, promotional, community_guidelines] }
        messageKey: { type: string, description: Localization key for the respectful explanation }
        message: { type: string, description: English fallback copy }
        action: { type: string, enum: [replace] }

    # --- Staff API ---

    StaffRole:
      type: string
      enum: [moderator, admin]

    AdminNote:
      type: [string, 'null']
      maxLength: 500
      description: Optional internal note; stored in the audit log only

    AdminSuspensionReason:
      type: string
      enum: [harassment, scam_or_spam, impersonation, underage_concern, hateful_conduct, community_guidelines]

    AdminRestoreReason:
      type: string
      enum: [appeal_upheld, decision_error, concern_resolved]

    AdminPageMeta:
      type: object
      additionalProperties: false
      required: [requestId, nextCursor]
      properties:
        requestId: { type: string }
        nextCursor: { type: [string, 'null'] }

    AdminMediaPaths:
      type: object
      additionalProperties: false
      required: [thumb, display]
      properties:
        thumb: { type: string, pattern: '^/v1/admin/content/photos/[^/]+/media/thumb$' }
        display: { type: string, pattern: '^/v1/admin/content/photos/[^/]+/media/display$' }

    AdminOwnerContext:
      type: object
      description: Minimum owner context; never DOB, email or Firebase UID
      additionalProperties: false
      required: [userId, displayName, accountStatus]
      properties:
        userId: { type: string }
        displayName: { type: [string, 'null'] }
        accountStatus:
          oneOf:
            - { $ref: '#/components/schemas/AccountStatus' }
            - { type: 'null' }

    PhotoRejection:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    AdminReasonOption:
      type: object
      additionalProperties: false
      required: [code, description]
      properties:
        code: { type: string }
        description: { type: string }

    AdminMeResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [role, permissions]
          properties:
            role: { $ref: '#/components/schemas/StaffRole' }
            permissions:
              type: array
              items: { type: string, enum: [content.review, account.manage, audit.read] }
        meta: { $ref: '#/components/schemas/Meta' }

    AdminReasonsResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [photoRejection, promptAnswerRejection, accountSuspension, accountRestore]
          properties:
            photoRejection: { type: array, items: { $ref: '#/components/schemas/AdminReasonOption' } }
            promptAnswerRejection: { type: array, items: { $ref: '#/components/schemas/AdminReasonOption' } }
            accountSuspension: { type: array, items: { $ref: '#/components/schemas/AdminReasonOption' } }
            accountRestore: { type: array, items: { $ref: '#/components/schemas/AdminReasonOption' } }
        meta: { $ref: '#/components/schemas/Meta' }

    AdminPhotoQueueResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [id, ownerId, width, height, submittedAt, media]
            properties:
              id: { type: string }
              ownerId: { type: string }
              width: { type: integer }
              height: { type: integer }
              submittedAt: { type: string, format: date-time }
              media: { $ref: '#/components/schemas/AdminMediaPaths' }
        meta: { $ref: '#/components/schemas/AdminPageMeta' }

    AdminPhotoDetailResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, state, ownerId, width, height, contentVersion, rejectionReason, submittedAt, reviewedAt, media, owner, ownerPhotos]
          properties:
            id: { type: string }
            state: { $ref: '#/components/schemas/ReviewState' }
            ownerId: { type: string }
            width: { type: integer }
            height: { type: integer }
            contentVersion: { type: integer }
            rejectionReason:
              oneOf:
                - { $ref: '#/components/schemas/PhotoRejection' }
                - { type: 'null' }
            submittedAt: { type: string, format: date-time }
            reviewedAt: { type: [string, 'null'], format: date-time }
            media: { $ref: '#/components/schemas/AdminMediaPaths' }
            owner: { $ref: '#/components/schemas/AdminOwnerContext' }
            ownerPhotos:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, state, media]
                properties:
                  id: { type: string }
                  state: { $ref: '#/components/schemas/ReviewState' }
                  media: { $ref: '#/components/schemas/AdminMediaPaths' }
        meta: { $ref: '#/components/schemas/Meta' }

    AdminReviewRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        reason: { type: [string, 'null'], description: Required for reject; catalog code }
        note: { $ref: '#/components/schemas/AdminNote' }

    AdminPromptReviewRequest:
      type: object
      additionalProperties: false
      required: [decision, expectedRevision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        reason: { type: [string, 'null'], description: Required for reject; promptAnswerRejection code }
        note: { $ref: '#/components/schemas/AdminNote' }
        expectedRevision: { type: integer, minimum: 1 }

    AdminPhotoDecisionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, state, rejectionReason, auditId]
          properties:
            id: { type: string }
            state: { type: string, enum: [approved, rejected] }
            rejectionReason:
              oneOf:
                - { $ref: '#/components/schemas/PhotoRejection' }
                - { type: 'null' }
            auditId: { type: string }
        meta: { $ref: '#/components/schemas/Meta' }

    AdminPromptQueueResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [id, ownerId, promptId, promptText, pendingText, hasPublishedText, revision, submittedAt]
            properties:
              id: { type: string }
              ownerId: { type: string }
              promptId: { type: string }
              promptText: { type: string }
              pendingText: { type: string }
              hasPublishedText: { type: boolean }
              revision: { type: integer, minimum: 1 }
              submittedAt: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/AdminPageMeta' }

    AdminPromptDetailResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, state, ownerId, promptId, promptText, pendingText, approvedText, revision, publishedRevision, rejectionReason, submittedAt, owner]
          properties:
            id: { type: string }
            state: { $ref: '#/components/schemas/ReviewState' }
            ownerId: { type: string }
            promptId: { type: string }
            promptText: { type: string }
            pendingText: { type: [string, 'null'] }
            approvedText: { type: [string, 'null'] }
            revision: { type: integer, minimum: 1 }
            publishedRevision: { type: integer, minimum: 0 }
            rejectionReason:
              oneOf:
                - { $ref: '#/components/schemas/PromptRejection' }
                - { type: 'null' }
            submittedAt: { type: string, format: date-time }
            owner: { $ref: '#/components/schemas/AdminOwnerContext' }
        meta: { $ref: '#/components/schemas/Meta' }

    AdminPromptDecisionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, state, publishedRevision, rejectionReason, auditId]
          properties:
            id: { type: string }
            state: { type: string, enum: [approved, rejected] }
            publishedRevision: { type: integer, minimum: 0 }
            rejectionReason:
              oneOf:
                - { $ref: '#/components/schemas/PromptRejection' }
                - { type: 'null' }
            auditId: { type: string }
        meta: { $ref: '#/components/schemas/Meta' }

    AdminAccount:
      type: object
      description: Never DOB, email or Firebase UID
      additionalProperties: false
      required: [userId, displayName, accountStatus, profileReady, guardVersion, suspension, createdAt]
      properties:
        userId: { type: string }
        displayName: { type: [string, 'null'] }
        accountStatus: { $ref: '#/components/schemas/AccountStatus' }
        profileReady: { type: boolean }
        guardVersion: { type: integer, minimum: 1 }
        suspension:
          oneOf:
            - type: object
              additionalProperties: false
              required: [reason, suspendedAt]
              properties:
                reason: { $ref: '#/components/schemas/AdminSuspensionReason' }
                suspendedAt: { type: string, format: date-time }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }

    AdminAccountResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/AdminAccount' }
        meta: { $ref: '#/components/schemas/Meta' }

    AdminAccountActionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [account, auditId]
          properties:
            account: { $ref: '#/components/schemas/AdminAccount' }
            auditId: { type: string }
        meta: { $ref: '#/components/schemas/Meta' }

    AdminAuditLogResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, actorUid, actorRole, action, targetType, targetId, targetOwnerId, reason, note, before, after, requestId, createdAt]
            properties:
              id: { type: string }
              actorUid: { type: string, description: Verified Firebase UID of the staff member }
              actorRole: { $ref: '#/components/schemas/StaffRole' }
              action:
                type: string
                enum: [photo.approve, photo.reject, prompt_answer.approve, prompt_answer.reject, account.suspend, account.restore]
              targetType: { type: string, enum: [photo, promptAnswer, user] }
              targetId: { type: string }
              targetOwnerId: { type: string }
              reason: { type: [string, 'null'] }
              note: { type: [string, 'null'] }
              before: { type: object }
              after: { type: object }
              requestId: { type: string }
              createdAt: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/Meta' }

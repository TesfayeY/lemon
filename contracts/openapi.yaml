openapi: 3.1.0
info:
  title: Lemon API
  version: 0.4.0
  description: |
    Contract for phases 03-04: identity bootstrap, onboarding, catalogs,
    profiles, prompt answers and preferences.

    Response DTOs set `additionalProperties: false` so that any field added to
    a response (for example a private field leaking into a public profile)
    fails the contract test in `apps/api/test/contract.test.ts`.

    Successful responses are wrapped as `{ data, meta }`; failures as
    `{ error, requestId }`.
servers:
  - url: http://localhost:3000
security:
  - firebaseIdToken: []

paths:
  /v1/me/bootstrap:
    post:
      summary: Idempotently map the verified Firebase identity to an app account
      description: Also syncs the cached email verification flag from the verified token.
      responses:
        '200':
          description: Existing account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapResponse' }
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/me:
    get:
      summary: Private own-account snapshot with readiness and missing onboarding steps
      responses:
        '200':
          description: Account snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Account' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`ACCOUNT_RESTRICTED`: the account is suspended or being deleted'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: '`NOT_FOUND`: no app account for this identity yet (call `POST /v1/me/bootstrap`)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/me/onboarding:
    patch:
      summary: Save birth date and/or terms acceptance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                birthDate:
                  type: string
                  format: date
                  description: ISO calendar date; must be 18+ and not in the future
                termsAccepted:
                  const: true
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdatedResponse' }
        '400': { $ref: '#/components/responses/NoUpdates' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/catalogs:
    get:
      summary: Static catalogs with stable IDs
      security: []
      responses:
        '200':
          description: Catalogs
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Catalogs' }
                  meta: { $ref: '#/components/schemas/Meta' }

  /v1/me/profile:
    get:
      summary: Owner view of the profile draft, visibility settings and answers awaiting review
      responses:
        '200':
          description: Own profile
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/SelfProfile' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Edit own profile draft fields
      description: |
        Requires the revision the edit was based on. Server-owned fields
        (readiness, status, roles, revisions) are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionedUpdateResponse' }
        '400': { $ref: '#/components/responses/NoUpdates' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/me/profile/preview:
    get:
      summary: Own profile exactly as other people would see it
      responses:
        '200':
          description: Public projection of own profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/prompts:
    post:
      summary: Submit an answer to a prompt; it is held for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [promptId, text]
              properties:
                promptId: { type: string }
                text: { $ref: '#/components/schemas/PromptText' }
      responses:
        '201':
          description: Answer submitted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [id, promptId, state, revision]
                    properties:
                      id: { type: string }
                      promptId: { type: string }
                      state: { $ref: '#/components/schemas/ReviewState' }
                      revision: { type: integer, minimum: 1 }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/me/prompts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      summary: Submit replacement text for review; approved text stays published meanwhile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, text]
              properties:
                expectedRevision: { type: integer }
                text: { $ref: '#/components/schemas/PromptText' }
      responses:
        '200':
          description: Replacement submitted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [id, state, revision]
                    properties:
                      id: { type: string }
                      state: { $ref: '#/components/schemas/ReviewState' }
                      revision: { type: integer, minimum: 1 }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Remove an own answer
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [deleted]
                    properties:
                      deleted: { const: true }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/preferences:
    get:
      summary: Private dating preferences
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Preferences' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Edit dating preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferencesUpdate' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionedUpdateResponse' }
        '400': { $ref: '#/components/responses/NoUpdates' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Opaque app user ID (never a Firebase UID)
        schema: { type: string }
    get:
      summary: Public profile, in context only (no searchable directory)
      description: |
        Returns the same public projection as a Discover card. Visible profiles:

        - your own (exactly as others see it, like `GET /v1/me/profile/preview`);
        - anyone you could see in Discover right now (every discovery rule is
          rechecked: status, readiness, pause, mutual gender/interest, age and
          location, likes, passes, blocks and other pair exclusions);
        - anyone with a pending like to you that the Likes list shows (sender
          active, ready, not paused, not blocked).

        Everyone else, including unknown IDs, gets the same 404
        `PROFILE_UNAVAILABLE`, so the response never says why.

        Errors: 403 `ACCOUNT_NOT_ELIGIBLE` (viewer not active and ready);
        404 `PROFILE_UNAVAILABLE`.
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`PROFILE_UNAVAILABLE`: missing, or not visible to this viewer (indistinguishable)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/discovery:
    get:
      summary: Discover page (new session, or continue one with a cursor)
      description: |
        Without `cursor`, starts a short-lived discovery session: a bounded,
        server-shuffled snapshot of mutually eligible candidates tied to the
        viewer's preferences revision and residence city. With `cursor`,
        continues that session. Eligibility (status, readiness, pause, mutual
        gender/interest, mutual age, mutual US city/state/nationwide scope,
        likes, passes, blocks and other pair exclusions) is rechecked for every
        page, and the cursor tracks scanned positions, so pages never repeat or
        skip a candidate. Order is a uniform shuffle; nothing is ranked.

        `status`:
        - `more`: call again with `meta.nextCursor`. A page can be short, even
          empty, when many scanned candidates dropped out.
        - `end`: the session is fully scanned; start a new one later.
        - `empty`: nobody matches the viewer's current filters. Filters are
          never widened by the server; offer a user-triggered filter change.

        Each card is `{ profile }`: the same `PublicProfile` projection that
        `GET /v1/profiles/{id}` returns, approved photos included.

        Errors: `INVALID_CURSOR` (400, malformed, tampered or another person's
        cursor), `DISCOVERY_SESSION_EXPIRED` and `DISCOVERY_SESSION_INVALIDATED`
        (409, retryable: restart without a cursor), `ACCOUNT_NOT_ELIGIBLE` and
        `DISCOVERY_PAUSED` (403).
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque signed cursor from `meta.nextCursor`
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: One page of candidates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryPageResponse' }
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DiscoverySessionStale' }

  /v1/passes:
    post:
      summary: Pass on a candidate for the cooldown (default 30 days)
      description: |
        Idempotent per viewer and candidate: repeating an active pass returns it
        unchanged; a pass whose cooldown has ended is renewed. Any existing user
        may be passed, so the response never reveals whether the candidate is
        blocked, paused or otherwise unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidateId]
              properties:
                candidateId: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Pass recorded (or already active)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PassResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # --- Likes (Phase 08) -----------------------------------------------------
  /v1/likes:
    post:
      operationId: sendLike
      summary: Like one photo or prompt answer at a specific content version
      description: |
        The sender is the verified token's account; any sender field in the body
        is ignored. Validation (recipient available, target owned by the
        recipient, published, version current) happens before the daily charge,
        all inside one transaction: a rejected or rolled-back like charges nothing.
        One like per direction ever in v1. The sender never learns whether a like
        was declined. Blocks are reported as `PROFILE_UNAVAILABLE`, never distinctly.

        Error codes: 400 `IDEMPOTENCY_KEY_REQUIRED`; 403 `ACCOUNT_NOT_ELIGIBLE`,
        `ACCOUNT_PAUSED`, `ACCOUNT_RESTRICTED`; 404 `PROFILE_UNAVAILABLE`
        (recipient missing, inactive, unready, paused or blocked), `NOT_FOUND`
        (caller has no account); 409 `TARGET_UNAVAILABLE`, `TARGET_STALE`,
        `ALREADY_LIKED`, `INCOMING_LIKE_PENDING`, `IDEMPOTENCY_KEY_REUSED`;
        422 `VALIDATION_ERROR`, `SELF_LIKE`; 429 `QUOTA_EXHAUSTED` with `limit`,
        `resetAt` and a `Retry-After` header in seconds.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            8-128 of `A-Z a-z 0-9 - _`, scoped to the sender. Same key and same
            payload replays the original like (200); same key and a different
            payload is 409 `IDEMPOTENCY_KEY_REUSED`.
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendLikeRequest' }
      responses:
        '200':
          description: Replay of the like created earlier with this Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendLikeResponse' }
        '201':
          description: Like created and one like charged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendLikeResponse' }
        '400': { $ref: '#/components/responses/LikeError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/LikeError' }
        '404': { $ref: '#/components/responses/LikeError' }
        '409': { $ref: '#/components/responses/LikeError' }
        '422': { $ref: '#/components/responses/LikeError' }
        '429': { $ref: '#/components/responses/LikeError' }

  /v1/likes/quota:
    get:
      operationId: getLikeQuota
      summary: Remaining daily allowance for the like composer
      description: The allowance resets at UTC midnight on the server clock; show `resetAt` in local time.
      responses:
        '200':
          description: Current allowance
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/LikeQuota' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/LikeError' }
        '404': { $ref: '#/components/responses/LikeError' }

  /v1/likes/incoming:
    get:
      operationId: listIncomingLikes
      summary: Pending likes from currently available senders, newest first
      description: |
        Paused, inactive, unready and blocked senders are hidden (their likes stay
        stored and reappear when the sender is available again). A page may be
        short when senders are hidden; keep paging until `meta.nextCursor` is null.

        Error codes: 400 `INVALID_CURSOR`; 403 `ACCOUNT_NOT_ELIGIBLE`,
        `ACCOUNT_RESTRICTED`; 422 `VALIDATION_ERROR` (limit).
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque `meta.nextCursor` from the previous page
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: One page of incoming likes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncomingLikesResponse' }
        '400': { $ref: '#/components/responses/LikeError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/LikeError' }
        '404': { $ref: '#/components/responses/LikeError' }
        '422': { $ref: '#/components/responses/LikeError' }

  /v1/likes/{id}/decline:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: declineLike
      summary: Decline an incoming like (recipient only, idempotent, terminal)
      description: |
        Charges nothing. Declining again returns the original decision. Anyone
        but the recipient gets 404 `LIKE_NOT_FOUND`; 409 `LIKE_ALREADY_DECIDED`
        once accepting exists.
      responses:
        '200':
          description: The like is declined
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [id, state, decidedAt]
                    properties:
                      id: { type: string }
                      state: { const: declined }
                      decidedAt: { type: string, format: date-time }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/LikeError' }
        '404': { $ref: '#/components/responses/LikeError' }
        '409': { $ref: '#/components/responses/LikeError' }

  /v1/likes/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: acceptLike
      summary: Accept an incoming like (not available until matching, Phase 09)
      description: |
        Returns 501 `ACCEPT_NOT_AVAILABLE` to the recipient and creates nothing.
        Anyone but the recipient gets 404 `LIKE_NOT_FOUND`.
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/LikeError' }
        '404': { $ref: '#/components/responses/LikeError' }
        '501': { $ref: '#/components/responses/LikeError' }

components:
  securitySchemes:
    firebaseIdToken:
      type: http
      scheme: bearer
      description: Firebase ID token; the only source of identity

  responses:
    Unauthenticated:
      description: Missing, invalid or revoked token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Account restricted or not eligible
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found or not owned by the caller
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NoUpdates:
      description: No editable fields in the request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Invalid state or duplicate
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RevisionConflict:
      description: The edit was based on a stale revision; refresh and reapply
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: One or more fields are invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidCursor:
      description: Malformed, tampered or not the caller's cursor (INVALID_CURSOR)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    DiscoverySessionStale:
      description: Session expired or preferences changed; restart without a cursor
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

    LikeError:
      description: Like error; each operation's description lists its codes
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LikeErrorResponse' }

  schemas:
    Meta:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId: { type: string }

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, requestId]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            retryable: { type: boolean }
            fieldErrors:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
            currentRevision:
              type: integer
              description: Present on REVISION_CONFLICT
        requestId: { type: string }

    ErrorCode:
      type: string
      description: |
        Every error code the API sends (`apps/api/test/contract.test.ts` fails
        when the code sends one that is missing here). Show localized copy per
        code; never show `message` to people.

        - Any route: 401 `UNAUTHENTICATED`, `TOKEN_REVOKED`; 500 `INTERNAL_ERROR`;
          404 `NOT_FOUND` (no app account yet: call `POST /v1/me/bootstrap`; also
          a missing own resource or unknown route).
        - Accounts: 403 `ACCOUNT_RESTRICTED` (suspended or being deleted),
          `ACCOUNT_NOT_ELIGIBLE` (not active and profile-ready); 422
          `AGE_INELIGIBLE` (under 18); 409 `INVALID_STATE` (onboarding step
          after onboarding ended); 400 `NO_UPDATES` (no editable field sent).
        - Profiles and prompts: 422 `VALIDATION_ERROR`, `PROMPT_LIMIT` (three
          answers already); 409 `REVISION_CONFLICT` (with `currentRevision`),
          `DUPLICATE_PROMPT`, `CONCURRENT_EDIT` (retryable); 404
          `PROFILE_UNAVAILABLE` (another person's profile is missing or not
          visible to you; deliberately indistinguishable).
        - Discovery: 403 `DISCOVERY_PAUSED`; 400 `INVALID_CURSOR`; 409
          `DISCOVERY_SESSION_EXPIRED`, `DISCOVERY_SESSION_INVALIDATED`.
        - Photos and media (see `openapi/media.yaml` per endpoint):
          `IDEMPOTENCY_KEY_REQUIRED`, `IDEMPOTENCY_KEY_REUSED`,
          `UPLOAD_IN_PROGRESS`, `FILE_REQUIRED`, `INVALID_MULTIPART`,
          `PAYLOAD_TOO_LARGE`, `UNSUPPORTED_MEDIA_TYPE`, `INVALID_IMAGE`,
          `IMAGE_DIMENSIONS_INVALID`, `PHOTO_LIMIT_REACHED`, `PHOTO_SET_BUSY`,
          `PHOTO_NOT_FOUND`, `PHOTO_SET_MISMATCH`, `MEDIA_UNAVAILABLE`,
          `STORAGE_UNAVAILABLE`.
        - Likes (see `/v1/likes*` per endpoint): `ACCOUNT_PAUSED`, `SELF_LIKE`,
          `TARGET_UNAVAILABLE`, `TARGET_STALE`, `ALREADY_LIKED`,
          `INCOMING_LIKE_PENDING`, `QUOTA_EXHAUSTED`, `LIKE_NOT_FOUND`,
          `LIKE_ALREADY_DECIDED`, `ACCEPT_NOT_AVAILABLE`.
      enum:
        - UNAUTHENTICATED
        - TOKEN_REVOKED
        - INTERNAL_ERROR
        - NOT_FOUND
        - ACCOUNT_RESTRICTED
        - ACCOUNT_NOT_ELIGIBLE
        - AGE_INELIGIBLE
        - INVALID_STATE
        - NO_UPDATES
        - VALIDATION_ERROR
        - PROMPT_LIMIT
        - REVISION_CONFLICT
        - DUPLICATE_PROMPT
        - CONCURRENT_EDIT
        - PROFILE_UNAVAILABLE
        - DISCOVERY_PAUSED
        - INVALID_CURSOR
        - DISCOVERY_SESSION_EXPIRED
        - DISCOVERY_SESSION_INVALIDATED
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - UPLOAD_IN_PROGRESS
        - FILE_REQUIRED
        - INVALID_MULTIPART
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - INVALID_IMAGE
        - IMAGE_DIMENSIONS_INVALID
        - PHOTO_LIMIT_REACHED
        - PHOTO_SET_BUSY
        - PHOTO_NOT_FOUND
        - PHOTO_SET_MISMATCH
        - MEDIA_UNAVAILABLE
        - STORAGE_UNAVAILABLE
        - ACCOUNT_PAUSED
        - SELF_LIKE
        - TARGET_UNAVAILABLE
        - TARGET_STALE
        - ALREADY_LIKED
        - INCOMING_LIKE_PENDING
        - QUOTA_EXHAUSTED
        - LIKE_NOT_FOUND
        - LIKE_ALREADY_DECIDED
        - ACCEPT_NOT_AVAILABLE

    UpdatedResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [updated]
          properties:
            updated: { type: array, items: { type: string } }
        meta: { $ref: '#/components/schemas/Meta' }

    RevisionedUpdateResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [updated, revision]
          properties:
            updated: { type: array, items: { type: string } }
            revision: { type: integer, minimum: 2 }
        meta: { $ref: '#/components/schemas/Meta' }

    BootstrapResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [userId, accountStatus, profileReady, adultEligible]
          properties:
            userId: { type: string }
            accountStatus: { $ref: '#/components/schemas/AccountStatus' }
            profileReady: { type: boolean }
            adultEligible: { type: boolean }
        meta: { $ref: '#/components/schemas/Meta' }

    AccountStatus:
      type: string
      enum: [onboarding, active, suspended, deletion_pending, deleted]

    ReadinessRequirement:
      type: string
      description: A requirement the profile does not yet meet, in onboarding order
      enum:
        - emailVerified
        - adultEligible
        - termsAccepted
        - displayName
        - genderIdentity
        - interests
        - location
        - intention
        - photos
        - promptAnswers
        - accountSuspended

    Readiness:
      type: object
      additionalProperties: false
      required: [ready, missing]
      properties:
        ready: { type: boolean }
        missing:
          type: array
          items: { $ref: '#/components/schemas/ReadinessRequirement' }

    Account:
      type: object
      description: Private; only ever returned to the account owner
      additionalProperties: false
      required: [userId, accountStatus, emailVerified, birthDate, adultEligible, profileReady,
        discoverPaused, agreements, readiness]
      properties:
        userId: { type: string }
        accountStatus: { $ref: '#/components/schemas/AccountStatus' }
        emailVerified: { type: boolean }
        birthDate: { type: [string, 'null'], format: date }
        adultEligible: { type: boolean }
        profileReady: { type: boolean }
        discoverPaused: { type: boolean }
        agreements:
          type: object
          additionalProperties: false
          required: [termsVersion, acceptedAt]
          properties:
            termsVersion: { type: [string, 'null'] }
            acceptedAt: { type: [string, 'null'], format: date-time }
        readiness: { $ref: '#/components/schemas/Readiness' }

    Visibility:
      type: string
      enum: [public, private]

    ReviewState:
      type: string
      enum: [pending, approved, rejected]

    DisplayName:
      type: string
      description: 1-40 grapheme clusters after whitespace normalization; any script
      minLength: 1

    PromptText:
      type: string
      description: 1-300 grapheme clusters after whitespace normalization
      minLength: 1

    OptionalText:
      type: [string, 'null']
      description: At most 100 grapheme clusters after whitespace normalization

    GenderSelfDescription:
      type: [string, 'null']
      description: |
        Optional words of your own next to the gender catalog choice; at most 100
        grapheme clusters after whitespace normalization, blank clears it. Never
        used for eligibility, matching or ranking (the catalog choice is the
        matching category). Owner-only until text review exists: it is not part
        of `PublicProfile`, whatever `genderDisplay` says.

    PromptAnswer:
      type: object
      description: A published answer as other users see it
      additionalProperties: false
      required: [id, promptId, promptText, text, contentVersion]
      properties:
        id: { type: string }
        promptId: { type: string }
        promptText: { type: string }
        text: { type: string, description: Published (approved) text only }
        contentVersion:
          type: integer
          minimum: 1
          description: |
            Version of the published text. A like on this answer sends it as
            `target.contentVersion`; it changes only when a new revision is published.

    SelfPromptAnswer:
      type: object
      description: The owner's view of an answer, including a submission awaiting review
      additionalProperties: false
      required: [id, promptId, promptText, approvedText, pendingText, state, revision]
      properties:
        id: { type: string }
        promptId: { type: string }
        promptText: { type: string }
        approvedText: { type: [string, 'null'] }
        pendingText: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/ReviewState' }
        revision: { type: integer, minimum: 1 }

    SelfProfile:
      type: object
      additionalProperties: false
      required: [userId, displayName, genderIdentity, genderDisplay, genderSelfDescription, cityId,
        cityName, stateCode, intention, bio, hometown, hometownDisplay, occupation, occupationDisplay,
        education, educationDisplay, height, heightDisplay, languages, languagesDisplay, religion,
        religionDisplay, promptAnswers, revision, profileReady]
      properties:
        userId: { type: string }
        displayName: { type: [string, 'null'] }
        genderIdentity: { type: [string, 'null'] }
        genderDisplay: { $ref: '#/components/schemas/Visibility' }
        genderSelfDescription: { $ref: '#/components/schemas/GenderSelfDescription' }
        cityId: { type: [string, 'null'] }
        cityName: { type: [string, 'null'] }
        stateCode: { type: [string, 'null'] }
        intention: { type: [string, 'null'] }
        bio: { type: [string, 'null'] }
        hometown: { $ref: '#/components/schemas/OptionalText' }
        hometownDisplay: { $ref: '#/components/schemas/Visibility' }
        occupation: { $ref: '#/components/schemas/OptionalText' }
        occupationDisplay: { $ref: '#/components/schemas/Visibility' }
        education: { $ref: '#/components/schemas/OptionalText' }
        educationDisplay: { $ref: '#/components/schemas/Visibility' }
        height: { type: [integer, 'null'], minimum: 100, maximum: 250 }
        heightDisplay: { $ref: '#/components/schemas/Visibility' }
        languages: { type: array, items: { type: string } }
        languagesDisplay: { $ref: '#/components/schemas/Visibility' }
        religion: { $ref: '#/components/schemas/OptionalText' }
        religionDisplay: { $ref: '#/components/schemas/Visibility' }
        promptAnswers:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/SelfPromptAnswer' }
        revision: { type: integer, minimum: 1 }
        profileReady: { type: boolean }

    PublicProfile:
      type: object
      description: |
        Explicit allowlist. Never contains birth date, email, Firebase UID,
        account status, moderation data, revisions or visibility settings.
        Fields the owner set to private are null (or empty for languages).
        Name, age and location are null only in the owner's preview of an
        incomplete draft. Only approved photos and published prompt text
        appear; the gender self-description is never part of it (owner-only
        until text review exists).
      additionalProperties: false
      required: [userId, displayName, age, cityName, stateCode, intention, intentionLabel,
        genderIdentity, genderLabel, bio, hometown, occupation, education, height, languages,
        religion, promptAnswers, photos]
      properties:
        userId: { type: string }
        displayName: { type: [string, 'null'] }
        age: { type: [integer, 'null'], minimum: 18 }
        cityName: { type: [string, 'null'] }
        stateCode: { type: [string, 'null'] }
        intention: { type: [string, 'null'] }
        intentionLabel: { type: [string, 'null'] }
        genderIdentity: { type: [string, 'null'] }
        genderLabel: { type: [string, 'null'] }
        bio: { type: [string, 'null'] }
        hometown: { type: [string, 'null'] }
        occupation: { type: [string, 'null'] }
        education: { type: [string, 'null'] }
        height: { type: [integer, 'null'] }
        languages: { type: array, items: { type: string } }
        religion: { type: [string, 'null'] }
        promptAnswers:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/PromptAnswer' }
        photos:
          type: array
          maxItems: 6
          description: Approved photos only, in the owner's order
          items: { $ref: '#/components/schemas/PublicPhoto' }

    PublicProfileResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/PublicProfile' }
        meta: { $ref: '#/components/schemas/Meta' }

    ProfileUpdate:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer }
        displayName: { $ref: '#/components/schemas/DisplayName' }
        genderIdentity: { type: string, description: Gender catalog ID }
        genderDisplay: { $ref: '#/components/schemas/Visibility' }
        genderSelfDescription: { $ref: '#/components/schemas/GenderSelfDescription' }
        cityId: { type: string, description: City catalog ID; sets stateCode }
        intention: { type: string, description: Intention catalog ID }
        bio: { type: [string, 'null'], description: At most 500 grapheme clusters }
        hometown: { $ref: '#/components/schemas/OptionalText' }
        hometownDisplay: { $ref: '#/components/schemas/Visibility' }
        occupation: { $ref: '#/components/schemas/OptionalText' }
        occupationDisplay: { $ref: '#/components/schemas/Visibility' }
        education: { $ref: '#/components/schemas/OptionalText' }
        educationDisplay: { $ref: '#/components/schemas/Visibility' }
        height: { type: [integer, 'null'], minimum: 100, maximum: 250 }
        heightDisplay: { $ref: '#/components/schemas/Visibility' }
        languages:
          type: array
          description: Language catalog IDs; duplicates are removed
          items: { type: string }
        languagesDisplay: { $ref: '#/components/schemas/Visibility' }
        religion: { $ref: '#/components/schemas/OptionalText' }
        religionDisplay: { $ref: '#/components/schemas/Visibility' }

    LocationScope:
      type: string
      enum: [city, state, nationwide]

    Preferences:
      type: object
      description: Private; never part of any public projection
      additionalProperties: false
      required: [acceptedGenderCategories, minAge, maxAge, locationScope, longDistance, revision]
      properties:
        acceptedGenderCategories: { type: array, items: { type: string } }
        minAge: { type: integer, minimum: 18, maximum: 99 }
        maxAge: { type: integer, minimum: 18, maximum: 99 }
        locationScope: { $ref: '#/components/schemas/LocationScope' }
        longDistance: { type: boolean }
        revision: { type: integer, minimum: 1 }

    PreferencesUpdate:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer }
        acceptedGenderCategories:
          type: array
          minItems: 1
          description: Gender catalog IDs; duplicates are removed
          items: { type: string }
        minAge: { type: integer, minimum: 18, maximum: 99 }
        maxAge: { type: integer, minimum: 18, maximum: 99, description: Must be >= minAge }
        locationScope: { $ref: '#/components/schemas/LocationScope' }
        longDistance: { type: boolean }

    CatalogOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }

    Catalogs:
      type: object
      additionalProperties: false
      required: [states, cities, prompts, intentions, genderCategories, languages]
      properties:
        states:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, name]
            properties:
              code: { type: string }
              name: { type: string }
        cities:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, stateCode, countryCode]
            properties:
              id: { type: string }
              name: { type: string }
              stateCode: { type: string }
              countryCode: { const: US }
        prompts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, category, text, active]
            properties:
              id: { type: string }
              category: { type: string, enum: [general, cultural, lifestyle, dating] }
              text: { type: string }
              active: { const: true }
        intentions:
          type: array
          items: { $ref: '#/components/schemas/CatalogOption' }
        genderCategories:
          type: array
          items: { $ref: '#/components/schemas/CatalogOption' }
        languages:
          type: array
          items: { $ref: '#/components/schemas/CatalogOption' }

    PublicPhoto:
      type: object
      description: |
        An approved photo in a public profile. Bytes only via the authenticated
        media route, which rechecks access on every read; never a storage key or URL.
      additionalProperties: false
      required: [id, order, width, height, contentVersion, media]
      properties:
        id: { type: string }
        order: { type: integer, minimum: 0 }
        width: { type: integer }
        height: { type: integer }
        contentVersion:
          type: integer
          minimum: 1
          description: A like on this photo sends it as `target.contentVersion`
        media:
          type: object
          additionalProperties: false
          required: [thumb, display]
          properties:
            thumb: { type: string, pattern: '^/v1/media/[^/]+/thumb$' }
            display: { type: string, pattern: '^/v1/media/[^/]+/display$' }

    DiscoveryCard:
      type: object
      description: The candidate's public projection (photos are in `profile.photos`)
      additionalProperties: false
      required: [profile]
      properties:
        profile: { $ref: '#/components/schemas/PublicProfile' }

    DiscoveryPageResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, status, preferencesRevision]
          properties:
            items:
              type: array
              maxItems: 10
              items: { $ref: '#/components/schemas/DiscoveryCard' }
            status: { type: string, enum: [more, end, empty] }
            preferencesRevision: { type: integer, minimum: 1 }
        meta:
          type: object
          additionalProperties: false
          required: [requestId, nextCursor]
          properties:
            requestId: { type: string }
            nextCursor: { type: [string, 'null'] }

    PassResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [candidateId, passedAt, expiresAt]
          properties:
            candidateId: { type: string }
            passedAt: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/Meta' }

    # --- Likes (Phase 08) ---------------------------------------------------
    LikeErrorResponse:
      type: object
      additionalProperties: false
      required: [error, requestId]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code:
              type: string
              examples: [QUOTA_EXHAUSTED, TARGET_STALE, TARGET_UNAVAILABLE, PROFILE_UNAVAILABLE, ALREADY_LIKED]
            message: { type: string }
            retryable: { type: boolean }
            fieldErrors:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
            limit:
              type: integer
              minimum: 0
              description: Present on QUOTA_EXHAUSTED
            resetAt:
              type: string
              format: date-time
              description: Present on QUOTA_EXHAUSTED; the next UTC midnight
        requestId: { type: string }

    LikeTarget:
      type: object
      additionalProperties: false
      required: [kind, id, contentVersion]
      properties:
        kind: { type: string, enum: [photo, prompt] }
        id: { type: string, description: Stable photo ID or prompt answer ID }
        contentVersion:
          type: integer
          minimum: 1
          description: The photo's contentVersion, or the prompt answer's published revision

    SendLikeRequest:
      type: object
      required: [toUserId, target]
      properties:
        toUserId: { type: string, description: Opaque app user ID of the recipient }
        target: { $ref: '#/components/schemas/LikeTarget' }
        comment:
          type: [string, 'null']
          description: |
            Optional; at most 200 grapheme clusters after NFC and whitespace
            normalization (an emoji sequence or a letter with combining marks
            counts once). Blank is stored as no comment.

    LikeQuota:
      type: object
      additionalProperties: false
      required: [limit, used, remaining, resetAt]
      properties:
        limit: { type: integer, minimum: 0, description: LIKES_PER_UTC_DAY (P-10 proposes 8) }
        used: { type: integer, minimum: 0 }
        remaining: { type: integer, minimum: 0 }
        resetAt: { type: string, format: date-time, description: The next UTC midnight }

    OutgoingLike:
      type: object
      description: The sender's view of a like; never reveals whether it was declined
      additionalProperties: false
      required: [id, toUserId, target, comment, createdAt]
      properties:
        id: { type: string }
        toUserId: { type: string }
        target: { $ref: '#/components/schemas/LikeTarget' }
        comment: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    SendLikeResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [like, quota]
          properties:
            like: { $ref: '#/components/schemas/OutgoingLike' }
            quota: { $ref: '#/components/schemas/LikeQuota' }
        meta: { $ref: '#/components/schemas/Meta' }

    LikeMediaPaths:
      type: object
      description: Authenticated media paths; access is rechecked on every read
      additionalProperties: false
      required: [thumb, display]
      properties:
        thumb: { type: string }
        display: { type: string }

    LikePhoto:
      type: object
      description: Same allowlist as a public photo
      additionalProperties: false
      required: [id, order, width, height, contentVersion, media]
      properties:
        id: { type: string }
        order: { type: integer }
        width: { type: integer }
        height: { type: integer }
        contentVersion: { type: integer, minimum: 1 }
        media: { $ref: '#/components/schemas/LikeMediaPaths' }

    LikeSender:
      type: object
      description: Explicit allowlist. Never birth date, email, Firebase UID, account status or moderation data.
      additionalProperties: false
      required: [userId, displayName, age, cityName, stateCode, photo]
      properties:
        userId: { type: string }
        displayName: { type: [string, 'null'] }
        age: { type: [integer, 'null'], minimum: 18 }
        cityName: { type: [string, 'null'] }
        stateCode: { type: [string, 'null'] }
        photo:
          oneOf:
            - { $ref: '#/components/schemas/LikePhoto' }
            - { type: 'null' }

    LikeContext:
      description: |
        What was liked, rendered from the snapshot taken at send time. Photo media
        is present only while the photo is still approved at the liked version.
        Prompt answer text is present while the answer is still published (the
        liked words, even if since edited). Removed content is never shown.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, media]
          properties:
            kind: { const: photo }
            media:
              oneOf:
                - { $ref: '#/components/schemas/LikeMediaPaths' }
                - { type: 'null' }
        - type: object
          additionalProperties: false
          required: [kind, promptId, promptText, answerText]
          properties:
            kind: { const: prompt }
            promptId: { type: string }
            promptText: { type: string }
            answerText: { type: [string, 'null'] }

    IncomingLike:
      type: object
      additionalProperties: false
      required: [id, sender, target, context, targetChanged, comment, createdAt, canAccept]
      properties:
        id: { type: string }
        sender: { $ref: '#/components/schemas/LikeSender' }
        target: { $ref: '#/components/schemas/LikeTarget' }
        context: { $ref: '#/components/schemas/LikeContext' }
        targetChanged:
          type: boolean
          description: True when the liked item is no longer available as liked; show "This profile item changed"
        comment: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        canAccept:
          type: boolean
          description: Always false until matching ships (Phase 09)

    IncomingLikesResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [likes]
          properties:
            likes:
              type: array
              items: { $ref: '#/components/schemas/IncomingLike' }
        meta:
          type: object
          additionalProperties: false
          required: [requestId, nextCursor]
          properties:
            requestId: { type: string }
            nextCursor: { type: [string, 'null'] }
